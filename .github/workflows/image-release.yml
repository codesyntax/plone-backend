name: Release Image to Container registry

on:
  workflow_call:
    inputs:
      plone-version:
        required: true
        type: string
      image-name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      platforms:
        required: true
        type: string
      load:
        required: false
        type: boolean
        default: false
      push:
        required: false
        type: boolean
        default: false
      is-latest:
        required: false
        type: boolean
        default: false
      tag-suffix:
        description: >-
          Append this suffix to every image tag and publish only the suffixed
          tags (opt-in experimental release). Empty for a normal release.
        required: false
        type: string
        default: ''
      build-version:
        description: >-
          Value passed as the PLONE_VERSION build arg (used for the base image
          tag and constraints). Defaults to plone-version; for an experimental
          release the downstream images pass the suffixed base tag.
        required: false
        type: string
        default: ''
    secrets:
      ghcr-registry-username:
        required: true
      ghcr-registry-password:
        required: true
      docker-registry-username:
        required: true
      docker-registry-password:
        required: true

jobs:

  release:
    runs-on: [self-hosted, ARM64, stable]

    environment: DOCKER_HUB
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ inputs.image-name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,enable=${{ inputs.tag-suffix == '' }}
            type=ref,event=pr,enable=${{ inputs.tag-suffix == '' }}
            type=pep440,pattern={{version}}, value=${{ inputs.plone-version }},enable=${{ inputs.tag-suffix == '' }}
            type=pep440,pattern={{major}}.{{minor}}.{{patch}}, value=${{ inputs.plone-version }},enable=${{ inputs.tag-suffix == '' }}
            type=pep440,pattern={{major}}.{{minor}}, value=${{ inputs.plone-version }},enable=${{ inputs.tag-suffix == '' }}
            type=pep440,pattern={{major}}, value=${{ inputs.plone-version }},enable=${{ inputs.tag-suffix == '' }}
            type=sha,enable=${{ inputs.tag-suffix == '' }}
            type=raw,value=latest,enable=${{ inputs.is-latest && inputs.tag-suffix == '' }}
            type=raw,value=${{ inputs.plone-version }},enable=${{ inputs.tag-suffix == '' }}
            type=raw,value=${{ inputs.plone-version }}${{ inputs.tag-suffix }},enable=${{ inputs.tag-suffix != '' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.ghcr-registry-username }}
          password: ${{ secrets.ghcr-registry-password }}

      - name: Login to Docker Hub Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.docker-registry-username }}
          password: ${{ secrets.docker-registry-password }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ inputs.platforms }}
          context: .
          file: ${{ inputs.dockerfile }}
          build-args: |
            PLONE_VERSION=${{ inputs.build-version || inputs.plone-version }}
          push: ${{ inputs.push && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ inputs.load }}
